<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="FIRa">
<title>FIRa</title>
<style>
@font-face{font-family:TimesNewRomanBitmap;src:url(assets/TimesNewRoman.ttf)}
*{box-sizing:border-box;outline:0}html,body{min-height:100vh;width:100%;margin:0;padding:0}html{font-size:16px;font-family:serif;-webkit-font-smoothing:none;-moz-osx-font-smoothing:grayscale}body{background:#000;color:#fff;line-height:2.2}a{color:#22f;cursor:pointer;text-decoration:none}a:hover{background:#22f;color:#fff;text-decoration:none}.container{padding:1rem 0 2rem 1rem}.wiggle{display:inline-block;transform-origin:50% 50%}h1.home__powder{margin:0 0 1.75rem;letter-spacing:.15em;font-size:3rem;font-family:serif;font-weight:400;line-height:3rem}.home__menu{margin:0;padding:0;list-style:none}.home__menu li{line-height:2.2}.home__menu span{margin-right:.3em}.home__header{display:flex;align-items:flex-start;gap:1rem;margin-top:.25rem}h2{margin:0 0 .8rem;height:1.8rem;letter-spacing:.4em;font-weight:700;font-size:1.25rem;line-height:1.8rem}.home__header .tour{margin-right:0}.home__header .show-all{margin-top:.2em;padding:0 .4em;height:1.6em;border:1px dotted #fff;color:#fff;vertical-align:middle;text-decoration:none;font-size:.8rem;line-height:1.6em}.home__header .show-all:hover{border:1px solid #22f}.dates{display:flex}.dates__year{flex:0 0 auto;margin-top:-.5em;width:3em}.dates__year li{margin-bottom:.5em;padding:.1em 0;line-height:1.4em}.dates__lives{padding-left:1em;border-left:1px solid #fff}.lives{width:auto;list-style:none;margin:0;padding:0}.live{position:relative;margin-bottom:.5em;padding:.1em 0;line-height:1.4em}.live__wrapper{position:relative;display:inline-flex;flex-wrap:wrap;height:100%;color:#fff!important;text-decoration:none;gap:.3em}.live__wrapper:hover{background:transparent;color:#fff!important}.live__date{display:grid;align-items:center;width:8em;color:#fff;grid-template-columns:auto 1fr;gap:.3em}.live__date>.dash{height:1px;background:#fff;vertical-align:middle}.live__city{white-space:nowrap}.live__city:before{content:'@'}.live__city:after{content:','}.live__country{white-space:nowrap}.live__flag{display:inline-block;line-height:1.4}.live.done .live__wrapper{opacity:.55}.discography{margin-top:2.8rem}.discography h2{margin-bottom:.8rem}.release-grid{display:grid;grid-template-columns:repeat(4,minmax(0,180px));gap:1.4rem}.release-art{display:block;width:100%;aspect-ratio:1;object-fit:cover;background:#222;margin-bottom:.35rem;image-rendering:auto}.release-title,.release-meta{margin:0;line-height:1.5}.release-meta{font-size:.8rem;color:#aaa}.site-footer{margin-top:3rem;font-size:.8rem;line-height:1.5;color:#aaa}
@media only screen and (max-width:460px){html{font-size:14px}body{line-height:1.8}.container{padding:.6rem}.home__powder{font-size:3rem}.home__menu li{line-height:1.8}.dates{display:block}.dates__year{width:auto}.dates__year li{display:inline-block;margin-right:1em;margin-bottom:.3em}.dates__lives{padding:.7em 0 0;border-top:1px solid #fff;border-left:none}.live__date{width:5em}.live__city:after,.live__country{display:none}.live__flag{margin:0}.release-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:1.2rem .8rem}}
@media (prefers-reduced-motion: no-preference){.wiggle{will-change:transform}}
  .music-links {
  display: flex;
  flex-direction: row;
  gap: 1.5rem;
  list-style: none;
  padding: 0;
  margin: 0;
  flex-wrap: wrap;
}
</style>
</head>
<body>
<main class="container">
  <h1 class="home__powder" aria-label="FIRa" id="artist-name"><span class="wiggle">F</span><span class="wiggle">I</span><span class="wiggle">R</span><span class="wiggle">a</span></h1>
  <ul class="music-links">
  <li><span class="wiggle"><a href="http://www.youtube.com/@firamadmusic" target="_blank" rel="noopener noreferrer">YouTube</a></span></li>
  <li><span class="wiggle"><a href="https://soundcloud.com/firamadmusic" target="_blank" rel="noopener noreferrer">SoundCloud</a></span></li>
  <li><span class="wiggle"><a href="https://open.spotify.com/user/cobek70" target="_blank" rel="noopener noreferrer">Playlist</a></span></li>
  <li><span class="wiggle"><a href="https://instagram.com/futuregarage_" target="_blank" rel="noopener noreferrer">Instagram</a></span></li>
</ul>
  <footer class="site-footer">aesthethic credit to powd.jp</footer>
</main>
<script src="https://cdn.jsdelivr.net/npm/simplex-noise@2.4.0/simplex-noise.min.js"></script>
<script>
(() => {
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

  const letters = [...document.querySelectorAll('.wiggle')];
  const noise = new SimplexNoise();

  const items = letters.map((el, i) => ({
    el,
    seed: i * 17.31 + Math.random() * 100,
    drift: 1.8,  // Movement distance in pixels
    speed: 0.65  // Higher = faster drift
  }));

  function animate(now) {
    const t = now / 1000;

    for (const item of items) {
      const time = t * item.speed;
      const s = item.seed;

      const x = noise.noise2D(s, time) * item.drift;
      const y = noise.noise2D(s + 100, time) * item.drift * 1.5;
      const r = noise.noise2D(s + 200, time) * 1.2;
      const skew = noise.noise2D(s + 300, time) * 0.5;

      item.el.style.transform =
        `translate3d(${x}px, ${y}px, 0) rotate(${r}deg) skewX(${skew}deg)`;
    }

    requestAnimationFrame(animate);
  }

  requestAnimationFrame(animate);
})();
</script>
</body>
</html>
